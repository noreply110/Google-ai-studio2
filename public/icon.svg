<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable safe area background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer tech ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#logo-grad)" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#logo-grad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Abstract Logo Elements -->
  <g filter="url(#glow)" transform="translate(16, 16) scale(0.93)">
    <!-- Outer shield / polygon -->
    <polygon points="256,60 416,152 416,336 256,428 96,336 96,152" fill="none" stroke="url(#logo-grad)" stroke-width="8" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Central interlocking Lightning Bolt representing J.A.R.V.I.S -->
    <path d="M 256,110 L 160,250 L 240,250 L 200,380 L 330,220 L 250,220 Z" fill="url(#accent-grad)" />
    
    <!-- Code bracket accents representing IDE and developer nature -->
    <path d="M 140,160 L 105,200 L 140,240" fill="none" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 372,160 L 407,200 L 372,240" fill="none" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tech Dots -->
  <circle cx="256" cy="60" r="6" fill="#38bdf8" />
  <circle cx="256" cy="452" r="6" fill="#fbbf24" />
  <circle cx="60" cy="256" r="6" fill="#a855f7" />
  <circle cx="452" cy="256" r="6" fill="#f43f5e" />
</svg>
