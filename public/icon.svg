<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Cyber Cyan -->
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <!-- Electric Indigo -->
    <linearGradient id="electric-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gold/Copper Coil Gradient -->
    <linearGradient id="gold-coil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Core Bright White/Cyan -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f7fa" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00838f" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="heavy-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="medium-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Maskable safe area background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer HUD Circular Grid and Accents -->
  <g opacity="0.35">
    <!-- Fine ticks around the outer edge -->
    <circle cx="256" cy="256" r="226" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2 6" />
    <circle cx="256" cy="256" r="216" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="12 12" />
    <circle cx="256" cy="256" r="206" fill="none" stroke="#3b82f6" stroke-width="1" />
    
    <!-- Outer crosshairs / corner brackets -->
    <path d="M 256,16 L 256,36 M 256,476 L 256,496 M 16,256 L 36,256 M 476,256 L 496,256" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
    <path d="M 96,96 L 80,96 L 80,112 M 416,96 L 432,96 L 432,112 M 80,400 L 80,416 L 96,416 M 432,400 L 432,416 L 416,416" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Deep Glow Base -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00f2fe" stroke-width="40" opacity="0.12" filter="url(#heavy-blur)" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#8b5cf6" stroke-width="30" opacity="0.15" filter="url(#heavy-blur)" />

  <!-- Main Reactor Outer Housing (Dark Metallic Bezel) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#111827" stroke-width="12" filter="url(#subtle-blur)" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="#1e293b" stroke-width="4" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />

  <!-- 10 Primary Power Segments (The circular sectors) -->
  <g filter="url(#subtle-blur)">
    <!-- Circumference is 2 * PI * 144 = 904.78. 10 segments + gaps = 90.48 each. Segment = 64, Gap = 26.48 -->
    <!-- Ambient Blue Segment Backgrounds -->
    <circle cx="256" cy="256" r="144" fill="none" stroke="#1d4ed8" stroke-width="22" stroke-dasharray="64 26.48" opacity="0.4" transform="rotate(-9, 256, 256)" />
    <!-- Bright Glowing Cyan Active Core Paths -->
    <circle cx="256" cy="256" r="144" fill="none" stroke="url(#glow-cyan)" stroke-width="14" stroke-dasharray="60 30.48" transform="rotate(-9, 256, 256)" filter="url(#subtle-blur)" />
    <circle cx="256" cy="256" r="144" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="52 38.48" opacity="0.9" transform="rotate(-9, 256, 256)" />
  </g>

  <!-- Copper Winding / electromagnetic coils (Overlaying the 10 segments to look real) -->
  <!-- We place 3 thin copper rings around each sector to represent electromagnetic coils -->
  <g stroke="url(#gold-coil)" stroke-width="12" stroke-linecap="butt" opacity="0.95">
    <!-- Coil wraps (Each wrap is 4px wide, placed around the 10 segments) -->
    <!-- For 10 sectors, we offset dasharray dynamically to create discrete coil wire groups -->
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(-3, 256, 256)" />
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(7, 256, 256)" />
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(17, 256, 256)" />
    
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(87, 256, 256)" />
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(97, 256, 256)" />
    <circle cx="256" cy="256" r="144" fill="none" stroke-dasharray="4 86.48" stroke-width="26" transform="rotate(107, 256, 256)" />
  </g>

  <!-- Inner Telemetry ring -->
  <circle cx="256" cy="256" r="114" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6" stroke-dasharray="30 15 10 15" />
  <circle cx="256" cy="256" r="106" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" stroke-dasharray="4 4" />

  <!-- Tri-Strut Internal Support Frame (Rotated 120 deg) -->
  <g stroke="#111827" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="256" y2="152" />
    <line x1="256" y1="256" x2="166" y2="308" />
    <line x1="256" y1="256" x2="346" y2="308" />
  </g>
  <g stroke="url(#glow-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#subtle-blur)">
    <line x1="256" y1="256" x2="256" y2="152" />
    <line x1="256" y1="256" x2="166" y2="308" />
    <line x1="256" y1="256" x2="346" y2="308" />
  </g>

  <!-- Iconic Triangular Reactor Core (Mark VI Style, Inverted Glowing Triangle) -->
  <!-- Triangle bounds slightly offset to center it visually at (256, 260) -->
  <g filter="url(#medium-blur)">
    <!-- Deep glowing outer cyan triangle background -->
    <polygon points="176,196 336,196 256,334" fill="none" stroke="#00f2fe" stroke-width="16" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Medium blue triangle border -->
    <polygon points="184,202 328,202 256,324" fill="none" stroke="url(#electric-blue)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Inner bright white-cyan triangle filament -->
    <polygon points="194,208 318,208 256,312" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" opacity="0.95" />
  </g>

  <!-- Central Starburst Core Generator -->
  <!-- Core Radial Glow Sphere -->
  <circle cx="256" cy="256" r="64" fill="url(#core-glow)" filter="url(#subtle-blur)" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#subtle-blur)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />

  <!-- Tri-node center points -->
  <circle cx="256" cy="152" r="5" fill="#ffffff" filter="url(#subtle-blur)" />
  <circle cx="166" cy="308" r="5" fill="#ffffff" filter="url(#subtle-blur)" />
  <circle cx="346" cy="308" r="5" fill="#ffffff" filter="url(#subtle-blur)" />
  <circle cx="256" cy="152" r="3" fill="#00f2fe" />
  <circle cx="166" cy="308" r="3" fill="#00f2fe" />
  <circle cx="346" cy="308" r="3" fill="#00f2fe" />

  <!-- Interactive status/telemetry markings in the corners -->
  <text x="50" y="470" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold" opacity="0.5">JARVIS CORE: v4.2</text>
  <text x="462" y="470" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold" opacity="0.5" text-anchor="end">SYS_STATUS: ONLINE</text>
</svg>
